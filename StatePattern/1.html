<!DOCTYPE html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
  <title>Лабораторная №1</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .container > div {
      display: none;
      flex-direction: column;
      gap: 10px;
      max-width: 300px;
      margin: 20px auto;
      padding: 20px;
      border: 1px solid #ff91a4;
      border-radius: 8px;
      background-color: white;
    }
    input, button {
      padding: 8px;
      margin: 5px 0;
      border: 1px solid #ff91a4;
      border-radius: 4px;
    }
    button {
      background-color: #ff91a4;
      color: white;
      cursor: pointer;
      border: none;
    }
    button:hover { background-color: #ffb6c1; }
    input:focus { outline: none; border-color: #ffb6c1; }
    #AName { background-color: #fff5f5; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <div id="STATE_N">
      <button id="NSignIn" type="button">Sign In</button>
      <button id="NRegistration" type="button">Registration</button>
    </div>
    <div id="STATE_A">
      <input type="text" id="AName" readonly />
      <button id="ASignOut" type="button">Sign Out</button>
    </div>
    <div id="STATE_R">
      <input id="RName" name="RName" type="text" placeholder="Login" />
      <input id="RPass" name="RPass" type="password" placeholder="Password" />
      <button id="RRegistration" type="button">Registration</button>
      <button id="RCancel" type="button">Cancel</button>
    </div>
    <div id="STATE_S">
      <input id="SName" name="SName" type="text" placeholder="Login" />
      <input id="SPass" name="SPass" type="password" placeholder="Password" />
      <button id="SSignIn" type="button">Sign In</button>
      <button id="SCancel" type="button">Cancel</button>
    </div>
  </div>
  <script>
    // -------------- хранилище
    let LocalUsers = JSON.parse(localStorage.getItem('users') || '[]');
    let UserNow = JSON.parse(localStorage.getItem('currentUser') || 'null');
    let StateNow = localStorage.getItem('currentState') || 'N';
    //-------------------
    function setCurrentUser(LocalUser) {
      UserNow = LocalUser;
      if (LocalUser === null) {
        localStorage.removeItem('currentUser');
      } else {
        localStorage.setItem('currentUser', JSON.stringify(UserNow));
      }
      broadcastState();
    }
    function setCurrentState(StateNew) {
      StateNow = StateNew;
      localStorage.setItem('currentState', StateNow);
      broadcastState(); // рассылаем всем вкладкам
    }    
    //------------------- BroadcastChannel 
    const channelSAID = new BroadcastChannel('SAID');
    let idSAID = Date.now();

    function broadcastState() {
      localStorage.setItem('users', JSON.stringify(LocalUsers));
      if (UserNow === null) localStorage.removeItem('currentUser'); 
      else localStorage.setItem('currentUser', JSON.stringify(UserNow));
      localStorage.setItem('currentState', StateNow);

      idSAID = Date.now();

      channelSAID.postMessage({
        type: 'UPDATE',
        id: idSAID,
        payload: { users: LocalUsers, currentUser: UserNow, currentState: StateNow },
      });
      notifyAllSubscribers();
    }

    channelSAID.onmessage = (event) => {
      const dataMSG = event.data;
      if (!dataMSG || dataMSG.type !== 'UPDATE') return;
      if (dataMSG.id === idSAID) return; // свое сообщение игнорируем
      
      // Применяем пришедшие данные
      LocalUsers = dataMSG.payload.users || [];
      UserNow = dataMSG.payload.currentUser || null;
      StateNow = dataMSG.payload.currentState || 'N';
      localStorage.setItem('users', JSON.stringify(LocalUsers));

      if (UserNow === null) localStorage.removeItem('currentUser'); 
      else localStorage.setItem('currentUser', JSON.stringify(UserNow));
      localStorage.setItem('currentState', StateNow);

      notifyAllSubscribers();

      Visio(StateNow, UserNow?.name);
    };

    //--------------------------------
    class SA {
      static START = { 
        A: 'A', 
        N: 'N' 
      };
      static COMMAND = {
        REG: 'REG',
        SIN: 'SIN',
        CAN: 'CAN',
        ADE: 'ADE',
        LIN: 'LIN',
        SOU: 'SOU',
        REJ: 'REJ',
      };
      static STATES = {
        A: SA.START.A,
        N: SA.START.N,
        S: 'S',
        R: 'R',
        SV: 'SV',
        RV: 'RV',
      };
      static TRANFUNC = {
        [SA.STATES.A]: { [SA.COMMAND.SOU]: SA.STATES.N },
        [SA.STATES.N]: { [SA.COMMAND.SIN]: SA.STATES.S, [SA.COMMAND.REG]: SA.STATES.R },
        [SA.STATES.S]: { [SA.COMMAND.SIN]: SA.STATES.SV, [SA.COMMAND.CAN]: SA.STATES.N },
        [SA.STATES.R]: { [SA.COMMAND.REG]: SA.STATES.RV, [SA.COMMAND.CAN]: SA.STATES.N },
        [SA.STATES.SV]: { [SA.COMMAND.LIN]: SA.STATES.A, [SA.COMMAND.ADE]: SA.STATES.S },
        [SA.STATES.RV]: { [SA.COMMAND.SIN]: SA.STATES.S, [SA.COMMAND.REJ]: SA.STATES.R },
      };

      constructor(startState) {
        this.state = startState && typeof startState === 'string' ? startState : SA.START.N;
        this.subscribers = {};
      }

      on(state, callback) {//Метод подписки.
        if (!this.subscribers[state]) this.subscribers[state] = [];
        this.subscribers[state].push(callback);
      }

      emit(state, data) {
        if (this.subscribers[state]) this.subscribers[state].forEach((callback) => callback(data));
      }

      RunCommand(command) {
        const nextState = SA.TRANFUNC[this.state]?.[command];
        console.log(this.state, ':RunCommand: command =', command, '--->', nextState);
        if (nextState !== undefined) {
          this.state = nextState;
          setCurrentState(this.state); // setCurrentState вызовет broadcastState()
          this.emit(this.state, SA.TRANFUNC[this.state]);//уведомление всех подписчиков о новом состоянии и предаем доступные команды
        }
        return { [this.state]: SA.TRANFUNC[this.state] };
      }
    }
      //------------------функции рассылки интерфейса
    const authStateSubscribers = new Set();
    function subscribeToAuthChanges(callback) {
      authStateSubscribers.add(callback);
    }
    function notifyAllSubscribers() {
      authStateSubscribers.forEach((subscriber) =>
        subscriber({ currentUser: UserNow, users: LocalUsers, currentState: StateNow })
      );
    }
    //------------рабочие функции
    function GetUserName(setA, setN) {
      if (UserNow && setA) {
        setA({ name: UserNow.name });
      } else {
        if (setN) setN();
      }
    }
    function Registration(NameInput, PassInput, sin, rej) {
      if (!NameInput || !PassInput) {
        if (rej) rej();
        return false;
      }
      const wasReg = LocalUsers.some((us) => us.name === NameInput);
      if (wasReg) {
        if (rej) rej();
        return false;
      }
      LocalUsers.push({ name: NameInput, pass: PassInput });
      
      localStorage.setItem('users', JSON.stringify(LocalUsers));
      
      UserNow = null;
      StateNow = 'N';
      localStorage.removeItem('currentUser');
      localStorage.setItem('currentState', StateNow);
      broadcastState();
      if (sin) sin(); // переходим, например, к экрану входа (если требуется)
      return true;
    }

    function SignIn(NameInput, PassInput, lin, ade) {
      LocalUsers = JSON.parse(localStorage.getItem('users') || '[]');
      const Suser = LocalUsers.find((Su) => Su.name === NameInput && Su.pass === PassInput);
      if (Suser) {
        UserNow = { name: Suser.name };
        // сохраняем и рассылаем
        localStorage.setItem('currentUser', JSON.stringify(UserNow));
        StateNow = 'A';
        localStorage.setItem('currentState', StateNow);
        broadcastState();
        if (lin) lin();
        return true;
      } else {
        if (ade) ade();
        return false;
      }
    }

    function SignOut(sou) {
      UserNow = null;
      localStorage.removeItem('currentUser');
      StateNow = 'N';
      localStorage.setItem('currentState', StateNow);
      broadcastState();
      if (sou) sou();
      return true;
    }
    //--------логика интерфейса
    function Visio(state, name) {
      STATE_N.style.display = STATE_R.style.display = STATE_S.style.display = STATE_A.style.display = 'none';

      if (state == SA.STATES.A) {
        AName.value = name || '';
        STATE_A.style.display = 'flex';
      } else if (state == SA.STATES.N) {
        STATE_N.style.display = 'flex';
      } else if (state == SA.STATES.R) {
        RName.value = RPass.value = '';
        STATE_R.style.display = 'flex';
      } else if (state == SA.STATES.S) {
        SPass.value = '';
        SName.value = name || '';
        STATE_S.style.display = 'flex';
      }
    }
    //----------новая вкладка подхватывает состояние
    const storedUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
    const storedState = localStorage.getItem('currentState');
    let initialState;
    if (storedState) {
      initialState = storedState;
    } else if (storedUser && storedUser.name) {
      initialState = SA.START.A; 
    } else {
      initialState = SA.START.N;
    }

    let sa = new SA(initialState);

 
    subscribeToAuthChanges(({ currentUser, currentState }) => {
      console.log('Broadcast received: state =', currentState, 'user =', currentUser?.name);
      if (currentState && currentState !== sa.state) {
        sa.state = currentState;
        Visio(sa.state, currentUser?.name);
      } else {
        Visio(sa.state, currentUser?.name);
      }
    });

    GetUserName(
      (obj) => { Visio(sa.state, obj.name); },
      () => { Visio(sa.state); }
    );

    // ---------подписки автомата на события
    sa.on(SA.STATES.RV, (nextstates) =>
      Registration(
        RName.value,
        RPass.value,
        () => {
          sa.RunCommand(SA.COMMAND.SIN); 
          Visio(sa.state);
        },
        () => {
          sa.RunCommand(SA.COMMAND.REJ);
          Visio(sa.state);
        },
      ),
    );

    sa.on(SA.STATES.SV, (nextstates) =>
      SignIn(
        SName.value,
        SPass.value,
        () => {
          setCurrentUser({ name: SName.value }); 
          sa.RunCommand(SA.COMMAND.LIN); // переводит в A, setCurrentState внутри RunCommand рассылет состояние
          Visio(sa.state, SName.value);
        },
        () => {
          sa.RunCommand(SA.COMMAND.ADE);
          Visio(sa.state);
        },
      ),
    );

    // ---------- обработчики
    NRegistration.onclick = () => { sa.RunCommand(SA.COMMAND.REG); Visio(sa.state); }
    NSignIn.onclick = () => { sa.RunCommand(SA.COMMAND.SIN); Visio(sa.state); }

    SSignIn.onclick = () => { // убрать async/await
      SignIn(
        SName.value,
        SPass.value,
        () => {
          // успех
          setCurrentUser({ name: SName.value });
          sa.state = SA.STATES.A;
          setCurrentState(sa.state);
          Visio(sa.state, SName.value);
        },
        () => {
          // ошибка
          SPass.value = '';
          SName.value = '';
          sa.RunCommand(SA.COMMAND.ADE);
        }
      );
    }

    SCancel.onclick = () => { sa.RunCommand(SA.COMMAND.CAN); Visio(sa.state); }

    RRegistration.onclick = () => { sa.RunCommand(SA.COMMAND.REG); Visio(sa.state); }
    RCancel.onclick = () => { sa.RunCommand(SA.COMMAND.CAN); Visio(sa.state); }

    ASignOut.onclick = async () => {
      await SignOut(() => {
        setCurrentUser(null);
        sa.state = SA.STATES.N;
        setCurrentState(sa.state);
        Visio(sa.state);
      });
    }
    Visio(sa.state, storedUser?.name);
  </script>
</body>
</html>
